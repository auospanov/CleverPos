# api.dominium.kz — уже есть, менять не нужно (прокси на :5088).
# Ниже — что ДОБАВИТЬ в nginx Famous Town (dominium.kz),
# чтобы /cabinet шёл в CleverPos, а не в Angular.
#
# Файл: /etc/nginx/sites-available/dominium.kz
# Вставить ВНУТРИ server { server_name dominium.kz; ... } ПЕРЕД location / { ... angular ... }

    location ^~ /cabinet {
        proxy_pass http://127.0.0.1:5088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    location ^~ /api/owner {
        proxy_pass http://127.0.0.1:5088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /css/cabinet.css {
        proxy_pass http://127.0.0.1:5088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
