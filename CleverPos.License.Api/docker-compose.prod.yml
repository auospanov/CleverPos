services:
  api:
    image: cleverpos-license-api:latest
    container_name: cleverpos-license-api
    restart: unless-stopped
    network_mode: host
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:${API_PORT:-5088}
      AdminApiKey: ${ADMIN_API_KEY:-change-me-admin-key}
      ConnectionStrings__DefaultConnection: ${LICENSE_DB:-Server=127.0.0.1;user id=root;password=Asd+12345678;database=cleverpos;charset=utf8mb4;default command timeout=1200;SslMode=none;AllowPublicKeyRetrieval=True}
      LicenseSigning__PrivateKeyXml: ${LICENSE_PRIVATE_KEY_XML:-}
      OwnerAuth__GoogleClientId: ${OWNER_GOOGLE_CLIENT_ID:-}
      OwnerAuth__GoogleClientSecret: ${OWNER_GOOGLE_CLIENT_SECRET:-}
      OwnerAuth__AppleClientId: ${OWNER_APPLE_CLIENT_ID:-}
      OwnerAuth__TelegramBotToken: ${OWNER_TELEGRAM_BOT_TOKEN:-}
      OwnerAuth__TelegramBotUsername: ${OWNER_TELEGRAM_BOT_USERNAME:-}
      OwnerAuth__JwtSigningKey: ${OWNER_JWT_SIGNING_KEY:-CHANGE-ME-OWNER-JWT-KEY-32CHARS-MIN}
      OwnerAuth__CabinetPublicOrigin: ${OWNER_CABINET_ORIGIN:-https://dominium.kz}
